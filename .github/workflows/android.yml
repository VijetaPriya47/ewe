name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["supabase/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.ewe.LogicTest"
      - name: Build APK
        run: ./gradlew :app:assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ewe.apk
      - uses: actions/upload-artifact@v6
        with:
          name: ewe-apk
          path: ewe.apk
      - name: Publish the release for this version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release per version (v0.5.0, v0.6.0 …), with that version's CHANGELOG.md section as notes.
          # Pushing again without a new version replaces that release's APK.
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="v$VERSION"
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {on = 1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          cp ewe.apk "ewe-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ewe-$VERSION.apk" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "ewe-$VERSION.apk" --target "$GITHUB_SHA" --title "ewe $VERSION" --notes-file notes.md --latest
          fi
          # Before 0.5.0 a single rolling release called "latest" was used; it is replaced by the list above.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
