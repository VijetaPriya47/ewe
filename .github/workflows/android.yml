name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["supabase/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.ewe.LogicTest"
      - name: Build APK
        env:
          EWE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ewe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ewe-apk
          path: ewe.apk
      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ewe.apk --title "ewe (build ${{ github.run_number }})" \
            --notes "Latest build from main. Download ewe.apk on your phone and open it to install."
